<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Order | Mellow_Fluff</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <a href="index.html" class="logo">Mellow_Fluff ♡</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="custom.html">Custom Order</a>
            <a href="about.html">About</a>
            <a href="cart.html">Cart 🛒</a>
        </div>
    </nav>
</header>

<main class="custom-page">
    <h1>Create Your Own Fluff! ♡</h1>
    <p>Have a special idea? Tell us what you want!</p>

    <form id="customForm">
        <label>Your Name</label>
        <input type="text" id="customerName" placeholder="Enter your name" required>

        <label>Product Type</label>
        <select id="productType" required>
            <option value="">Choose a product</option>
            <option>Hair Accessories</option>
            <option>Flower Bouquet</option>
            <option>Wall Decoration</option>
            <option>Desk Decoration</option>
            <option>Handmade Gifts</option>
            <option>Other Crafts</option>
        </select>

        <label>Describe Your Idea</label>
        <textarea id="description" placeholder="Describe your custom design..." required></textarea>

        <button type="submit" class="btn">Send Custom Request ♡</button>
    </form>

    <p class="custom-note">
        You can send your reference photo directly through WhatsApp chat.
    </p>
</main>

<footer>
    <p>© 2026 Mellow_Fluff</p>
    <p>Handmade with love ♡</p>
</footer>

<script src="script.js"></script>
</body>
</html>
